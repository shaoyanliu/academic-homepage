name: Update Google Scholar statistics

on:
  schedule:
    - cron: '16 5 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-statistics
  cancel-in-progress: false

jobs:
  update:
    # Opt in with a repository variable after configuring your own profile.
    if: vars.ENABLE_SCHOLAR_SYNC == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-scholar.txt
      - name: Install parser dependencies
        run: python -m pip install -r scripts/requirements-scholar.txt
      - name: Test data validation and failure handling
        run: python -m unittest discover -s tests -p 'test_scholar_stats.py'
      - name: Fetch current statistics via SerpApi
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/update_scholar_stats.py --provider serpapi
      - name: Save verified snapshot
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- _data/scholar_stats.yml
          if git diff --cached --quiet -- _data/scholar_stats.yml; then
            echo "Statistics already checked today; no new commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Google Scholar statistics"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
      # The Pages workflow listens for this workflow's successful completion.
      # A GITHUB_TOKEN-authored commit does not itself trigger push workflows.
