name: Deploy academic homepage

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Google Scholar statistics"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name != 'workflow_run' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Set repository-specific URLs
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASEURL: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          path = pathlib.Path('_config.yml')
          config = path.read_text()
          for key, value in {'url': os.environ['SITE_URL'], 'baseurl': os.environ['SITE_BASEURL']}.items():
              config = re.sub(rf'^{key}:.*$', lambda _: key + ': ' + json.dumps(value), config, flags=re.M)
          path.write_text(config)
          PY
      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
